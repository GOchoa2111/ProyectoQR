<div *ngIf="visible" class="modal-overlay">
  <div class="modal-content">
    <h3>Estudiante registrado exitosamente!! {{ nombre }} {{ apellido }}!</h3>
    <p>El codigo QR único del estudiante registrado es:</p>
    <img [src]="qrImagen" alt="QR del estudiante" id="qrImage" />

    <div class="botones">
      <button (click)="descargarQR()">Descargar QR</button>
      <!-- Envío por correo ahora se realiza automáticamente al registrar (no desde el modal) -->
      <button (click)="cerrarModal()">Cerrar</button>
    </div>
  </div>
</div>
