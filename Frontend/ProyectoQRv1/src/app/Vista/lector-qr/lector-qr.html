<div class="lector-container">
  <h2>Escaneo de Código QR</h2>

  <div class="camera-selector">
    <label for="camera">Selecciona cámara:</label>
    <!-- Usamos [ngModel]/(ngModelChange) para evitar el warning
         "Setting the same device is not allowed." -->
    <select
      id="camera"
      [ngModel]="selectedDevice"
      (ngModelChange)="selectedDevice = $event">
      <option *ngFor="let device of availableDevices" [ngValue]="device">
        {{ device.label }}
      </option>
    </select>
  </div>

  <div class="qr-container" [class.success]="mensajeMarcaje">
    <zxing-scanner
      [device]="selectedDevice"
      (scanSuccess)="onCodeResult($event)"
      (camerasFound)="onDevicesFound($event)">
    </zxing-scanner>
  </div>

  <!-- Eliminado el mat-card: ahora mostramos snack-bar -->
  
  <!-- Tarjeta de resultado en la parte inferior -->
  <div class="mensaje-validacion" *ngIf="mensajeTipo">
    <div class="mensaje-card" role="status" aria-live="polite">
  <div class="barra-left" [ngClass]="mensajeTipo || 'default'"></div>
      <div class="mensaje-body">
        <div class="tipo-title">{{ mensajeTipo }}</div>
        <div class="detalle">{{ getDetalle() }}</div>
      </div>
      <button class="close-btn" (click)="closeMensaje()" aria-label="Cerrar">Cerrar</button>
    </div>
  </div>
</div>
