<!-- Carrusel -->
<div class="carousel-container">
  <div
    class="carousel-slide"
    *ngFor="let imagen of imagenes; let i = index"
    [class.active]="i === imagenActual()"
  >
    <img [src]="imagen" alt="Imagen del carrusel" class="carousel-image" />
  </div>

<!-- Card de Angular Material -->
<div class="card-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Bienvenidos</mat-card-title>
      <mat-card-subtitle>Control de ingresos con código QR</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>
        Este sistema te permite registrar ingresos y egresos de forma rápida y segura usando códigos QR. Explora las opciones del menú para comenzar.
      </p>
    </mat-card-content>
    <mat-card-actions>
     <!--<button mat-button routerLink="/registro">Ir a Registro</button>-->
    </mat-card-actions>
  </mat-card>
</div>
