  <!-- Global error overlay: muestra errores JS en la página para depuración -->
  <script>
    (function () {
      function renderError(msg) {
        try {
          var existing = document.getElementById('global-error-overlay');
          if (existing) {
            existing.innerText = msg;
            return;
          }
          var el = document.createElement('div');
          el.id = 'global-error-overlay';
          el.style.position = 'fixed';
          el.style.zIndex = 2147483647;
          el.style.left = 0;
          el.style.top = 0;
          el.style.right = 0;
          el.style.padding = '12px 16px';
          el.style.background = 'rgba(200,20,20,0.95)';
          el.style.color = 'white';
          el.style.fontFamily = 'monospace';
          el.style.whiteSpace = 'pre-wrap';
          el.style.maxHeight = '40vh';
          el.style.overflow = 'auto';
          el.innerText = msg;
          document.documentElement.appendChild(el);
        } catch (e) {
          /* noop */
        }
      }

      window.addEventListener('error', function (ev) {
        var message = (ev && ev.message) || String(ev || 'Unknown error');
        renderError('Uncaught error: ' + message + '\n' + (ev && ev.filename ? ev.filename + ':' + ev.lineno + ':' + ev.colno : ''));
        console.error('Uncaught error (global handler):', ev.error || ev);
      });

      window.addEventListener('unhandledrejection', function (ev) {
        var reason = ev && ev.reason ? ev.reason : ev;
        renderError('Unhandled Promise rejection: ' + (reason && reason.message ? reason.message : String(reason)));
        console.error('Unhandled rejection (global handler):', reason);
      });
    })();
  </script>
